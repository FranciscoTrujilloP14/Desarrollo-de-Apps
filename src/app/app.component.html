<div class="container">
  <h1>Pokédex - PokéAPI</h1>

  <!-- Sección de búsqueda -->
  <div class="search-section">
    <h2>Buscar Pokémon</h2>
    <div class="search-group">
      <input 
        type="text" 
        [(ngModel)]="searchTerm" 
        placeholder="Escribe el nombre de un Pokémon..."
        class="search-input"
        (input)="searchPokemon(searchTerm)"
      />
    </div>
  </div>

  <!-- Mostrar errores -->
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <!-- Mostrar estado de carga -->
  <div *ngIf="loading" class="loading">
    ⏳ Cargando Pokémon...
  </div>

  <!-- Grid de Pokémon -->
  <div class="pokemon-grid" *ngIf="!loading">
    <div *ngFor="let pokemon of filteredPokemon" class="pokemon-card">
      <div class="card-image">
        <img 
          [src]="pokemon.sprites.front_default" 
          [alt]="pokemon.name"
          class="sprite">
      </div>
      
      <div class="card-info">
        <h3>{{ pokemon.name | uppercase }}</h3>
        <p class="pokemon-id">#{{ pokemon.id }}</p>

        <div class="types">
          <span *ngFor="let type of pokemon.types" 
                class="type-badge"
                [ngClass]="'type-' + type.type.name">
            {{ type.type.name }}
          </span>
        </div>

        <div class="stats">
          <p><strong>Alt:</strong> {{ pokemon.height / 10 }}m</p>
          <p><strong>Peso:</strong> {{ pokemon.weight / 10 }}kg</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje si no hay resultados -->
  <div *ngIf="!loading && filteredPokemon.length === 0" class="no-results">
    No se encontraron Pokémon. Intenta con otro término.
  </div>
</div>
